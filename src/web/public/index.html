<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Alyva-sre — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --background: #F8FAFC;
    --foreground: #0F172A;
    --primary: #FF6B2B;
    --primary-foreground: #FFFFFF;
    --accent: #EEF2F6;
    --muted: #64748B;
    --border: #E2E8F0;
    --card: #FFFFFF;
    --danger: #DC2626;
    --ok: #16A34A;
    --radius: 0.5rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0D1117;
      --foreground: #E2E8F0;
      --accent: #1B2431;
      --muted: #8B98A9;
      --border: #24303F;
      --card: #12181F;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
  }
  header img { height: 28px; }
  header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 0.8rem; }
  header a.nav { margin-left: auto; color: var(--primary); font-size: 0.85rem; text-decoration: none; }
  main { max-width: 1000px; margin: 0 auto; padding: 1.5rem; }
  section { margin-bottom: 2rem; }
  section h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); font-weight: 600; margin: 0 0 0.75rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1rem; margin-bottom: 0.6rem;
  }
  .headline-card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1.25rem; font-size: 1rem; font-weight: 600;
  }
  .headline-card.impact { border-left: 4px solid var(--danger); }
  .headline-card.no-impact { border-left: 4px solid var(--ok); color: var(--muted); font-weight: 400; }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .svc { font-weight: 600; }
  .tag {
    display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 0.1rem 0.5rem;
    border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .tag.critical { background: #FEE2E2; color: #991B1B; }
  .tag.high { background: #FFEDD5; color: #9A3412; }
  .tag.medium { background: #FEF9C3; color: #854D0E; }
  .tag.low { background: #E0F2FE; color: #075985; }
  .evidence {
    font-family: ui-monospace, monospace; font-size: 0.72rem; color: var(--muted);
    background: var(--accent); padding: 0.5rem; border-radius: 4px; margin-top: 0.5rem;
    overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  }
  .rationale { margin-top: 0.4rem; font-size: 0.85rem; }
  .actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; flex-wrap: wrap; }
  button {
    font: inherit; padding: 0.35rem 0.8rem; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--foreground); cursor: pointer;
  }
  button.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:hover { opacity: 0.85; }
  .empty { color: var(--muted); font-style: italic; padding: 0.5rem 0; }
  .edge-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
  .edge-table th { text-align: left; color: var(--muted); font-weight: 500; font-size: 0.75rem; padding: 0.3rem 0.5rem; border-bottom: 1px solid var(--border); }
  .edge-table td { padding: 0.4rem 0.5rem; border-bottom: 1px solid var(--border); }
  .edge-arrow { color: var(--muted); }
  .stat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 0.6rem; }
  .stat-tile { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.9rem; }
  .stat-tile .value { font-size: 1.6rem; font-weight: 700; margin-top: 0.2rem; }
  .stat-tile .label { font-size: 0.75rem; color: var(--muted); }
  .panel-chat { display: flex; gap: 0.4rem; margin-bottom: 0.8rem; }
  .panel-chat input { flex: 1; font: inherit; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); }
  details summary { cursor: pointer; color: var(--muted); font-size: 0.8rem; }
  #toast {
    position: fixed; bottom: 1rem; right: 1rem; background: var(--foreground); color: var(--background);
    padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.85rem; opacity: 0; transition: opacity 0.2s;
  }
</style>
</head>
<body>
<header>
  <img src="/logo.svg" alt="" onerror="this.style.display='none'" />
  <div>
    <h1>Alyva-sre</h1>
    <div class="sub">AI-native SRE dashboard</div>
  </div>
  <a href="/review.html" class="nav">Review &amp; approve &rarr;</a>
</header>
<main>
  <section id="business-impact-section">
    <h2>Business impact</h2>
    <div id="business-impact"></div>
  </section>

  <section id="latency-section">
    <h2>Top inter-service latency <span id="latency-meta" style="text-transform:none; font-weight:400;"></span></h2>
    <div id="latency"></div>
  </section>

  <section id="recommendations-section">
    <h2>Recommendations</h2>
    <div id="recommendations"></div>
  </section>

  <section id="trace-explorer-section">
    <h2>Ask AI about a trace</h2>
    <div class="panel-chat">
      <input type="text" id="trace-service-input" placeholder="Service name — e.g. checkout" style="max-width:200px;" />
      <button id="trace-search-btn">Find recent traces</button>
    </div>
    <div id="trace-list"></div>
    <div id="trace-qa" style="display:none;">
      <div class="card">
        <div class="row"><b>Trace: <span id="trace-qa-id"></span></b><button id="trace-qa-close">&times;</button></div>
        <div class="panel-chat" style="margin-top:0.6rem;">
          <input type="text" id="trace-question-input" placeholder="Ask a question about this trace..." />
          <button class="primary" id="trace-ask-btn">Ask</button>
        </div>
        <div id="trace-answer"></div>
      </div>
    </div>
  </section>

  <section id="custom-panels-section">
    <h2>Custom panels</h2>
    <div class="panel-chat">
      <input type="text" id="panel-request-input" placeholder="Ask for a panel — e.g. 'show me payment call rate'" />
      <button class="primary" id="panel-draft-btn">Draft</button>
    </div>
    <div id="panel-draft-preview"></div>
    <div class="stat-grid" id="kept-panels"></div>
  </section>
</main>
<div id="toast"></div>
<script>
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2200);
}
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(n) { return n == null ? 'n/a' : (Math.round(n*1000)/1000); }
function tierTag(c) { return c ? `<span class="tag ${c}">${c}</span>` : ''; }

async function api(url, opts) {
  const res = await fetch(url, { headers: { 'content-type': 'application/json' }, ...opts });
  const json = await res.json();
  if (!res.ok || json.ok === false) throw new Error(json.error || 'request failed');
  return json;
}

async function load() {
  const state = await api('/api/dashboard/state');
  renderBusinessImpact(state.businessImpact);
  renderLatency(state.serviceGraph);
  renderRecommendations(state.recommendations);
  renderKeptPanels(state.layout || []);
}

function renderBusinessImpact(bi) {
  const el = document.getElementById('business-impact');
  if (!bi.has_active_impact) {
    el.innerHTML = `<div class="headline-card no-impact">${escapeHtml(bi.headline)}</div>`;
    return;
  }
  el.innerHTML = `<div class="headline-card impact">${escapeHtml(bi.headline)}</div>` +
    bi.items.map(i => `
      <div class="card">
        <div class="row"><span class="svc">${escapeHtml(i.service_name)}</span> ${tierTag(i.criticality)}</div>
        <div class="rationale">${escapeHtml(i.headline)}</div>
        <div class="evidence">impact: ${escapeHtml(i.business_impact)}</div>
      </div>
    `).join('');
}

function renderLatency(graph) {
  const el = document.getElementById('latency');
  const meta = document.getElementById('latency-meta');
  const edges = graph.edges || [];
  meta.textContent = graph.computed_at ? `(${graph.traces_sampled} traces sampled, updated ${new Date(graph.computed_at).toLocaleTimeString()})` : '';
  if (!edges.length) { el.innerHTML = '<div class="empty">No cross-service edges found yet.</div>'; return; }

  const top = edges.slice(0, 5);
  const rest = edges.slice(5);
  const rowsHtml = (list) => list.map(e => `
    <tr>
      <td>${escapeHtml(e.source)} <span class="edge-arrow">&rarr;</span> ${escapeHtml(e.target)}</td>
      <td>${e.avg_latency_ms.toFixed(2)}ms</td>
      <td>${e.p99_latency_ms.toFixed(2)}ms</td>
      <td>${e.call_count}</td>
    </tr>
  `).join('');

  el.innerHTML = `
    <table class="edge-table">
      <thead><tr><th>Edge</th><th>Avg latency</th><th>p99</th><th>Calls sampled</th></tr></thead>
      <tbody>${rowsHtml(top)}</tbody>
    </table>
    ${rest.length ? `<details style="margin-top:0.5rem;"><summary>Show ${rest.length} more edge(s)</summary>
      <table class="edge-table" style="margin-top:0.5rem;"><tbody>${rowsHtml(rest)}</tbody></table></details>` : ''}
    ${(graph.excluded || []).length ? `<details style="margin-top:0.5rem;"><summary>${graph.excluded.length} edge(s) excluded from ranking</summary>
      <div class="evidence">${graph.excluded.map(e => `${e.source} -> ${e.target}: ${e.excluded_reason}`).join('\n')}</div></details>` : ''}
  `;
}

function renderRecommendations(rec) {
  const el = document.getElementById('recommendations');
  if (!rec.recommendations.length) { el.innerHTML = '<div class="empty">No recommendations yet — none come from a real investigation until one runs.</div>'; return; }
  el.innerHTML = rec.recommendations.map(r => `
    <div class="card">
      <div class="row">
        <span class="svc">${escapeHtml(r.service_name)}</span>
        <span style="font-size:0.75rem; color:var(--muted);">${escapeHtml(r.confidence || '')} confidence</span>
      </div>
      <div class="rationale">${escapeHtml(r.recommendation)}${r.is_code_fix ? ' <span class="tag critical">code fix</span>' : ''}</div>
      <div class="evidence">from investigation ${escapeHtml(r.investigation_id)}: ${escapeHtml(r.evidence_headline)}</div>
    </div>
  `).join('');
}

// ---- Trace explorer ----

document.getElementById('trace-search-btn').addEventListener('click', async () => {
  const service = document.getElementById('trace-service-input').value;
  if (!service) return;
  const listEl = document.getElementById('trace-list');
  listEl.innerHTML = '<div class="empty">Searching...</div>';
  try {
    const result = await api(`/api/dashboard/traces?service=${encodeURIComponent(service)}&limit=8`);
    if (!result.traces.length) { listEl.innerHTML = '<div class="empty">No recent traces found for that service.</div>'; return; }
    listEl.innerHTML = result.traces.map(t => `
      <div class="card" style="padding:0.6rem 1rem;">
        <div class="row">
          <span style="font-family:ui-monospace,monospace; font-size:0.8rem;">${escapeHtml(t.trace_id)}</span>
          <button data-trace="${t.trace_id}" class="open-trace-btn">Ask about this trace</button>
        </div>
        <div style="font-size:0.8rem; color:var(--muted);">${escapeHtml(t.root_trace_name || '')} — ${fmt(t.duration_ms)}ms</div>
      </div>
    `).join('');
    listEl.querySelectorAll('.open-trace-btn').forEach(b => b.addEventListener('click', () => openTraceQA(b.dataset.trace)));
  } catch (e) {
    listEl.innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`;
  }
});

let currentTraceId = null;

function openTraceQA(traceId) {
  currentTraceId = traceId;
  document.getElementById('trace-qa-id').textContent = traceId;
  document.getElementById('trace-answer').innerHTML = '';
  document.getElementById('trace-qa').style.display = 'block';
}
document.getElementById('trace-qa-close').addEventListener('click', () => {
  document.getElementById('trace-qa').style.display = 'none';
  currentTraceId = null;
});

async function askAboutCurrentTrace() {
  const input = document.getElementById('trace-question-input');
  if (!input.value || !currentTraceId) return;
  const answerEl = document.getElementById('trace-answer');
  answerEl.innerHTML = '<div class="empty">Thinking...</div>';
  try {
    const result = await api(`/api/dashboard/traces/${currentTraceId}/ask`, { method: 'POST', body: JSON.stringify({ question: input.value }) });
    const a = result.answer;
    answerEl.innerHTML = `
      <div class="rationale">${escapeHtml(a.answer)}</div>
      <div style="font-size:0.75rem; color:var(--muted); margin-top:0.3rem;">confidence: ${escapeHtml(a.confidence)}</div>
      ${result.ledger.length ? `<details style="margin-top:0.4rem;"><summary>${result.ledger.length} additional tool call(s) made</summary>
        <div class="evidence">${result.ledger.map(e => `${e.tool}(${JSON.stringify(e.args)})`).join('\n')}</div></details>` : ''}
    `;
    input.value = '';
  } catch (e) {
    answerEl.innerHTML = `<div class="empty">Error: ${escapeHtml(e.message)}</div>`;
  }
}
document.getElementById('trace-ask-btn').addEventListener('click', askAboutCurrentTrace);
document.getElementById('trace-question-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') askAboutCurrentTrace(); });

let currentDraftSpec = null;

async function draftPanel() {
  const input = document.getElementById('panel-request-input');
  if (!input.value) return;
  const preview = document.getElementById('panel-draft-preview');
  preview.innerHTML = '<div class="empty">Drafting...</div>';
  try {
    const result = await api('/api/dashboard/custom-panel/draft', { method: 'POST', body: JSON.stringify({ request: input.value }) });
    currentDraftSpec = result.spec;
    if (result.spec.cannot_fulfill_reason) {
      preview.innerHTML = `<div class="card"><div class="rationale">${escapeHtml(result.spec.cannot_fulfill_reason)}</div></div>`;
      return;
    }
    const val = result.data.kind === 'stat' ? `${fmt(result.data.value)} ${escapeHtml(result.spec.unit || '')}` : `${(result.data.series||[]).length} series point(s)`;
    preview.innerHTML = `
      <div class="card">
        <div class="row"><b>${escapeHtml(result.spec.title)}</b><span style="color:var(--muted); font-size:0.8rem;">${escapeHtml(result.spec.category)} / ${escapeHtml(result.spec.service_name)}</span></div>
        <div class="rationale">Preview: <b>${val}</b></div>
        ${result.data.error ? `<div class="evidence">${escapeHtml(result.data.error)}</div>` : ''}
        <div class="actions">
          <button class="primary" id="panel-keep-btn">Keep it</button>
          <button id="panel-discard-btn">Discard</button>
        </div>
      </div>
    `;
    document.getElementById('panel-keep-btn').addEventListener('click', async () => {
      await api('/api/dashboard/custom-panel/keep', { method: 'POST', body: JSON.stringify({ spec: currentDraftSpec }) });
      preview.innerHTML = '';
      input.value = '';
      toast('Panel kept');
      load();
    });
    document.getElementById('panel-discard-btn').addEventListener('click', () => {
      preview.innerHTML = '';
      input.value = '';
    });
  } catch (e) {
    preview.innerHTML = `<div class="card"><div class="rationale">Error: ${escapeHtml(e.message)}</div></div>`;
  }
}
document.getElementById('panel-draft-btn').addEventListener('click', draftPanel);
document.getElementById('panel-request-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') draftPanel(); });

function renderKeptPanels(layout) {
  const el = document.getElementById('kept-panels');
  if (!layout.length) { el.innerHTML = '<div class="empty">No custom panels kept yet.</div>'; return; }
  el.innerHTML = layout.map(p => `
    <div class="stat-tile" data-panel="${p.id}">
      <div class="label">${escapeHtml(p.title)}</div>
      <div class="value" id="panel-value-${p.id}">…</div>
      <div class="actions">
        <button data-panel="${p.id}" class="refresh-panel-btn">Refresh</button>
        <button data-panel="${p.id}" class="danger remove-panel-btn">Remove</button>
      </div>
    </div>
  `).join('');
  layout.forEach(p => refreshPanelValue(p.id));
  el.querySelectorAll('.refresh-panel-btn').forEach(b => b.addEventListener('click', () => refreshPanelValue(b.dataset.panel)));
  el.querySelectorAll('.remove-panel-btn').forEach(b => b.addEventListener('click', async () => {
    await api(`/api/dashboard/custom-panel/${b.dataset.panel}/remove`, { method: 'POST', body: JSON.stringify({}) });
    load();
  }));
}

async function refreshPanelValue(panelId) {
  const el = document.getElementById(`panel-value-${panelId}`);
  if (!el) return;
  try {
    const result = await api(`/api/dashboard/custom-panel/${panelId}/refresh`, { method: 'POST', body: JSON.stringify({}) });
    el.textContent = result.data.kind === 'stat' ? fmt(result.data.value) : `${(result.data.series||[]).length} pts`;
  } catch (e) {
    el.textContent = 'error';
  }
}

load();
setInterval(load, 20000);
</script>
</body>
</html>
