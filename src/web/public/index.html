<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Alyva-sre — Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --background: #F8FAFC;
    --foreground: #0F172A;
    --primary: #FF6B2B;
    --primary-foreground: #FFFFFF;
    --accent: #EEF2F6;
    --muted: #64748B;
    --border: #E2E8F0;
    --card: #FFFFFF;
    --danger: #DC2626;
    --ok: #16A34A;
    --radius: 0.5rem;
    --seq-1: #2a78d6;
    --seq-1-track: #cde2fb;
    --status-good: #0ca30c;
    --status-critical: #d03b3b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0D1117;
      --foreground: #E2E8F0;
      --accent: #1B2431;
      --muted: #8B98A9;
      --border: #24303F;
      --card: #12181F;
      --seq-1: #3987e5;
      --seq-1-track: #184f95;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--background); color: var(--foreground);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 14px; line-height: 1.5;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 0.75rem; flex-shrink: 0;
    padding: 0.75rem 1.25rem; border-bottom: 1px solid var(--border);
  }
  header img { height: 26px; }
  header h1 { font-size: 0.95rem; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 0.75rem; }
  header a.nav { margin-left: auto; color: var(--primary); font-size: 0.82rem; text-decoration: none; }

  .layout { flex: 1; display: flex; min-height: 0; overflow: hidden; }
  .dashboard-col { flex: 0 0 70%; display: flex; flex-direction: column; min-height: 0; border-right: 1px solid var(--border); }
  .chat-col { flex: 1; display: flex; flex-direction: column; min-height: 0; }

  .filter-bar {
    flex-shrink: 0; display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap;
    padding: 0.6rem 1rem; border-bottom: 1px solid var(--border); background: var(--card);
  }
  .filter-bar select {
    font: inherit; padding: 0.35rem 0.5rem; border-radius: 6px; border: 1px solid var(--border);
    background: var(--background); color: var(--foreground);
  }
  .filter-bar label { font-size: 0.75rem; color: var(--muted); }

  .dash-rows { flex: 1; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .dash-row { flex: 1; min-height: 0; display: flex; flex-direction: column; border-bottom: 1px solid var(--border); overflow: hidden; }
  .dash-row:last-child { border-bottom: none; }
  .dash-row h2 {
    flex-shrink: 0; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); font-weight: 600; margin: 0; padding: 0.5rem 1rem 0.3rem;
    display: flex; align-items: center; justify-content: space-between;
  }
  .dash-row-body { flex: 1; min-height: 0; overflow-y: auto; padding: 0 1rem 0.6rem; display: flex; gap: 0.8rem; }
  .dash-row-body > .col { flex: 1; min-width: 0; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 0.7rem 0.9rem; margin-bottom: 0.5rem; }
  .empty { color: var(--muted); font-style: italic; padding: 0.4rem 0; font-size: 0.85rem; }
  .evidence { font-family: ui-monospace, monospace; font-size: 0.7rem; color: var(--muted); background: var(--accent); padding: 0.4rem; border-radius: 4px; margin-top: 0.4rem; overflow-x: auto; white-space: pre-wrap; word-break: break-all; }

  .bar-row { display: grid; grid-template-columns: 90px 1fr 46px; align-items: center; gap: 0.5rem; padding: 0.24rem 0; }
  .bar-row .bar-label { font-size: 0.76rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .bar-track { height: 15px; background: var(--seq-1-track); border-radius: 0 4px 4px 0; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--seq-1); border-radius: 0 4px 4px 0; min-width: 2px; }
  .bar-row .bar-value { font-size: 0.76rem; text-align: right; font-variant-numeric: tabular-nums; }

  .status-pill { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.78rem; font-weight: 600; padding: 0.2rem 0.55rem; border-radius: 999px; }
  .status-pill.good { background: color-mix(in srgb, var(--status-good) 14%, transparent); color: var(--status-good); }
  .status-pill.critical { background: color-mix(in srgb, var(--status-critical) 14%, transparent); color: var(--status-critical); }
  .status-pill::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }

  .stat-tile { background: var(--card); border: 1px solid var(--border); border-top: 2px solid var(--seq-1); border-radius: var(--radius); padding: 0.6rem 0.8rem; margin-bottom: 0.5rem; }
  .stat-tile .value { font-size: 1.3rem; font-weight: 700; margin-top: 0.1rem; }
  .stat-tile .label { font-size: 0.72rem; color: var(--muted); }
  .stat-row { display: flex; gap: 0.6rem; flex-wrap: wrap; }
  .stat-row .stat-tile { flex: 1; min-width: 110px; }
  .sparkline { width: 100%; height: 32px; margin-top: 0.3rem; }

  .obs-list { list-style: none; margin: 0; padding: 0; font-size: 0.78rem; }
  .obs-list li { display: flex; justify-content: space-between; padding: 0.22rem 0; border-bottom: 1px solid var(--border); }
  .obs-list li:last-child { border-bottom: none; }
  .log-row { padding: 0.3rem 0; border-bottom: 1px solid var(--border); font-size: 0.75rem; }
  .log-row:last-child { border-bottom: none; }
  .log-row .log-meta { display: flex; gap: 0.5rem; color: var(--muted); font-size: 0.68rem; margin-bottom: 0.1rem; }
  .log-row .log-body { font-family: ui-monospace, monospace; }

  .chat-window { flex: 1; min-height: 0; overflow-y: auto; padding: 0.8rem; }
  .chat-msg { margin-bottom: 0.7rem; font-size: 0.85rem; }
  .chat-msg .who { font-size: 0.68rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.03em; }
  .chat-msg.user .who { color: var(--primary); }
  .chat-msg .body { margin-top: 0.15rem; white-space: pre-wrap; }
  .chat-input-row { flex-shrink: 0; display: flex; gap: 0.4rem; padding: 0.7rem; border-top: 1px solid var(--border); }
  .chat-input-row input { flex: 1; font: inherit; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); }

  button { font: inherit; padding: 0.35rem 0.75rem; border-radius: 6px; border: 1px solid var(--border); background: var(--card); color: var(--foreground); cursor: pointer; }
  button.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  button:hover { opacity: 0.85; }
  #toast {
    position: fixed; bottom: 1rem; right: 1rem; background: var(--foreground); color: var(--background);
    padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.85rem; opacity: 0; transition: opacity 0.2s;
  }
</style>
</head>
<body>
<header>
  <img src="/logo.svg" alt="" onerror="this.style.display='none'" />
  <div>
    <h1>Alyva-sre</h1>
    <div class="sub">AI-native SRE dashboard</div>
  </div>
  <a href="/review.html" class="nav">Review &amp; approve, business impact, latency &rarr;</a>
</header>
<div class="layout">
  <div class="dashboard-col">
    <div class="filter-bar">
      <label>Service / container</label>
      <select id="entity-select"><option value="all">All</option></select>
      <label>Time range</label>
      <select id="range-select">
        <option value="15">15m</option>
        <option value="60" selected>1h</option>
        <option value="360">6h</option>
        <option value="1440">24h</option>
      </select>
      <span id="health-pill" style="margin-left:auto;"></span>
    </div>
    <div class="dash-rows">
      <div class="dash-row">
        <h2>Metrics</h2>
        <div class="dash-row-body" id="metrics-body"></div>
      </div>
      <div class="dash-row">
        <h2>Traces</h2>
        <div class="dash-row-body" id="traces-body"></div>
      </div>
      <div class="dash-row">
        <h2>Logs</h2>
        <div class="dash-row-body" id="logs-body"></div>
      </div>
    </div>
  </div>
  <div class="chat-col">
    <div class="chat-window" id="chat-window"></div>
    <div class="chat-input-row">
      <input type="text" id="chat-input" placeholder="Ask about the system, or ask to build a panel..." />
      <button class="primary" id="chat-send-btn">Send</button>
    </div>
  </div>
</div>
<div id="toast"></div>
<script>
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2200);
}
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmt(n) { return n == null ? 'n/a' : (Math.round(n*1000)/1000); }

async function api(url, opts) {
  const res = await fetch(url, { headers: { 'content-type': 'application/json' }, ...opts });
  const json = await res.json();
  if (!res.ok || json.ok === false) throw new Error(json.error || 'request failed');
  return json;
}

function barRows(items, valueFn, labelFn, unit) {
  if (!items.length) return '<div class="empty">No data</div>';
  const max = Math.max(...items.map(valueFn), 0.001);
  return items.map(item => {
    const v = valueFn(item);
    const pct = Math.max(2, Math.min(100, (v / max) * 100));
    return `
      <div class="bar-row">
        <div class="bar-label" title="${escapeHtml(labelFn(item))}">${escapeHtml(labelFn(item))}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-value">${fmt(v)}${unit}</div>
      </div>
    `;
  }).join('');
}

// Minimal inline SVG sparkline — per the dataviz skill's stat-tile trend
// spec (12-point sparkline, de-emphasis hue). No charting library needed
// for a single-series trend line.
function sparkline(points) {
  if (!points || points.length < 2) return '';
  const vals = points.map(p => p.value).filter(Number.isFinite);
  if (vals.length < 2) return '';
  const min = Math.min(...vals), max = Math.max(...vals);
  const range = max - min || 1;
  const w = 100, h = 30;
  const step = w / (points.length - 1);
  const coords = points.map((p, i) => {
    const x = i * step;
    const y = h - ((p.value - min) / range) * h;
    return `${x.toFixed(1)},${Number.isFinite(y) ? y.toFixed(1) : h}`;
  }).join(' ');
  return `<svg class="sparkline" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${coords}" fill="none" stroke="var(--seq-1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round" /></svg>`;
}

let currentEntity = 'all';
let currentRange = 60;

async function loadEntities() {
  const result = await api('/api/dashboard/entities');
  const sel = document.getElementById('entity-select');
  const opts = result.entities.map(e => `<option value="${escapeHtml(e.name)}">${escapeHtml(e.name)}</option>`).join('');
  sel.innerHTML = `<option value="all">All</option>${opts}`;
}

document.getElementById('entity-select').addEventListener('change', (e) => { currentEntity = e.target.value; loadDashboard(); });
document.getElementById('range-select').addEventListener('change', (e) => { currentRange = Number(e.target.value); loadDashboard(); });

async function loadDashboard() {
  try {
    const o = await api(`/api/dashboard/observability?entity=${encodeURIComponent(currentEntity)}&range=${currentRange}`);
    renderHealth(o.health);
    renderMetrics(o);
    renderTraces(o.traces);
    renderLogs(o.logs);
  } catch (e) {
    console.error('dashboard load failed', e);
  }
}

function renderHealth(health) {
  const badCount = health.down_scrape_targets.length + health.elevated_error_rate.length;
  document.getElementById('health-pill').innerHTML = badCount === 0
    ? '<span class="status-pill good">All healthy</span>'
    : `<span class="status-pill critical">${badCount} issue(s)</span>`;
}

function renderMetrics(o) {
  const el = document.getElementById('metrics-body');
  if (o.mode === 'entity') {
    const m = o.metrics;
    const latest = (series) => series.length ? series[series.length - 1].value : null;
    el.innerHTML = `
      <div class="col">
        <div class="stat-row">
          ${m.cpu.length ? `<div class="stat-tile"><div class="label">CPU</div><div class="value">${fmt(latest(m.cpu))}%</div>${sparkline(m.cpu)}</div>` : ''}
          ${m.memory.length ? `<div class="stat-tile"><div class="label">Memory</div><div class="value">${fmt(latest(m.memory))}%</div>${sparkline(m.memory)}</div>` : ''}
          ${m.latency_p99_ms.length ? `<div class="stat-tile"><div class="label">p99 latency</div><div class="value">${fmt(latest(m.latency_p99_ms))}ms</div>${sparkline(m.latency_p99_ms)}</div>` : ''}
          ${m.error_rate.length ? `<div class="stat-tile"><div class="label">Error rate</div><div class="value">${fmt((latest(m.error_rate)||0)*100)}%</div>${sparkline(m.error_rate)}</div>` : ''}
        </div>
        ${!m.cpu.length && !m.memory.length && !m.latency_p99_ms.length && !m.error_rate.length ? '<div class="empty">No metrics found for this entity.</div>' : ''}
      </div>
    `;
  } else {
    el.innerHTML = `
      <div class="col"><div class="card"><div style="font-weight:600; font-size:0.78rem; margin-bottom:0.3rem;">Top CPU</div>${barRows(o.cpu, c => c.cpu_utilization_ratio, c => c.container_name, '%')}</div></div>
      <div class="col"><div class="card"><div style="font-weight:600; font-size:0.78rem; margin-bottom:0.3rem;">Top memory</div>${barRows(o.memory, c => c.memory_percent, c => c.container_name, '%')}</div></div>
      <div class="col" id="ai-panels-col"><div style="font-weight:600; font-size:0.78rem; margin-bottom:0.3rem; color:var(--muted);">AI-created panels</div><div id="kept-panels"></div></div>
    `;
    loadKeptPanels();
  }
}

async function loadKeptPanels() {
  const state = await api('/api/dashboard/state');
  const layout = state.layout || [];
  const el = document.getElementById('kept-panels');
  if (!el) return;
  if (!layout.length) { el.innerHTML = '<div class="empty">Auto-created when a rule fires — or ask the chat to build one.</div>'; return; }
  el.innerHTML = layout.map(p => `<div class="stat-tile" data-panel="${p.id}" ${p.auto ? `title="${escapeHtml(p.reason || 'Auto-created')}"` : ''}><div class="label">${p.auto ? '<span style="color:var(--accent); font-weight:700;">AUTO&nbsp;·</span> ' : ''}${escapeHtml(p.title)}</div><div class="value" id="panel-value-${p.id}">&hellip;</div></div>`).join('');
  layout.forEach(async p => {
    try {
      const result = await api(`/api/dashboard/custom-panel/${p.id}/refresh`, { method: 'POST', body: JSON.stringify({}) });
      const v = document.getElementById(`panel-value-${p.id}`);
      if (v) v.textContent = result.data.kind === 'stat' ? fmt(result.data.value) : `${(result.data.series||[]).length} pts`;
    } catch { /* best-effort */ }
  });
}

function renderTraces(traces) {
  const el = document.getElementById('traces-body');
  el.innerHTML = `<div class="col"><ul class="obs-list">${
    traces.length ? traces.map(t => `<li><span>${escapeHtml(t.service_name)}</span><span style="font-family:ui-monospace,monospace; color:var(--muted);">${escapeHtml(t.trace_id.slice(0,16))}&hellip;</span></li>`).join('') : '<li>No traces</li>'
  }</ul></div>`;
}

function renderLogs(logs) {
  const el = document.getElementById('logs-body');
  if (!logs.length) { el.innerHTML = '<div class="col"><div class="empty">No recent error logs.</div></div>'; return; }
  el.innerHTML = `<div class="col">${logs.map(l => {
    const time = l.ts ? new Date(l.ts * 1000).toLocaleTimeString() : '';
    return `<div class="log-row"><div class="log-meta"><span>${escapeHtml(time)}</span><span>${escapeHtml(l.service_name || 'unknown')}</span></div><div class="log-body">${escapeHtml(l.line)}</div></div>`;
  }).join('')}</div>`;
}

async function loadChatHistory() {
  const result = await api('/api/dashboard/chat/history');
  const win = document.getElementById('chat-window');
  win.innerHTML = result.messages.map(m => `
    <div class="chat-msg ${m.role}">
      <div class="who">${m.role === 'user' ? 'you' : 'ai'}</div>
      <div class="body">${escapeHtml(m.content || '')}</div>
    </div>
  `).join('') || '<div class="empty">Ask a question to get started.</div>';
  win.scrollTop = win.scrollHeight;
}

async function sendChatMessage() {
  const input = document.getElementById('chat-input');
  if (!input.value) return;
  const message = input.value;
  input.value = '';
  const win = document.getElementById('chat-window');
  win.innerHTML += `<div class="chat-msg user"><div class="who">you</div><div class="body">${escapeHtml(message)}</div></div>`;
  win.innerHTML += `<div class="chat-msg assistant" id="chat-pending"><div class="who">ai</div><div class="body">...</div></div>`;
  win.scrollTop = win.scrollHeight;
  try {
    const result = await api('/api/dashboard/chat', { method: 'POST', body: JSON.stringify({ message }) });
    document.getElementById('chat-pending').outerHTML = `<div class="chat-msg assistant"><div class="who">ai</div><div class="body">${escapeHtml(result.reply)}</div></div>`;
    win.scrollTop = win.scrollHeight;
    loadDashboard(); // a chat message may have created a panel or changed what's relevant
  } catch (e) {
    document.getElementById('chat-pending').outerHTML = `<div class="chat-msg assistant"><div class="who">ai</div><div class="body">Error: ${escapeHtml(e.message)}</div></div>`;
  }
}
document.getElementById('chat-send-btn').addEventListener('click', sendChatMessage);
document.getElementById('chat-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') sendChatMessage(); });

loadEntities();
loadChatHistory();
loadDashboard();
setInterval(loadDashboard, 20000);
</script>
</body>
</html>
