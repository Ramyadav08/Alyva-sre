<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Alyva-sre — Review &amp; Approve</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    --background: #F8FAFC;
    --foreground: #0F172A;
    --primary: #FF6B2B;
    --primary-foreground: #FFFFFF;
    --accent: #EEF2F6;
    --muted: #64748B;
    --border: #E2E8F0;
    --card: #FFFFFF;
    --danger: #DC2626;
    --ok: #16A34A;
    --radius: 0.5rem;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --background: #0D1117;
      --foreground: #E2E8F0;
      --accent: #1B2431;
      --muted: #8B98A9;
      --border: #24303F;
      --card: #12181F;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--background);
    color: var(--foreground);
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 14px;
    line-height: 1.5;
  }
  header {
    display: flex; align-items: center; gap: 0.75rem;
    padding: 1rem 1.5rem; border-bottom: 1px solid var(--border);
  }
  header img { height: 28px; }
  header h1 { font-size: 1rem; font-weight: 600; margin: 0; }
  header .sub { color: var(--muted); font-size: 0.8rem; }
  main { max-width: 900px; margin: 0 auto; padding: 1.5rem; }
  section { margin-bottom: 2rem; }
  section h2 {
    font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.04em;
    color: var(--muted); font-weight: 600; margin: 0 0 0.75rem;
  }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1rem; margin-bottom: 0.6rem;
  }
  .row { display: flex; justify-content: space-between; align-items: flex-start; gap: 1rem; }
  .svc { font-weight: 600; }
  .tag {
    display: inline-block; font-size: 0.7rem; font-weight: 600; padding: 0.1rem 0.5rem;
    border-radius: 999px; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .tag.critical { background: #FEE2E2; color: #991B1B; }
  .tag.high { background: #FFEDD5; color: #9A3412; }
  .tag.medium { background: #FEF9C3; color: #854D0E; }
  .tag.low { background: #E0F2FE; color: #075985; }
  .evidence {
    font-family: ui-monospace, monospace; font-size: 0.72rem; color: var(--muted);
    background: var(--accent); padding: 0.5rem; border-radius: 4px; margin-top: 0.5rem;
    overflow-x: auto; white-space: pre-wrap; word-break: break-all;
  }
  .rationale { margin-top: 0.4rem; font-size: 0.85rem; }
  .question { margin-top: 0.4rem; font-size: 0.85rem; color: var(--primary); }
  .actions { display: flex; gap: 0.4rem; margin-top: 0.6rem; flex-wrap: wrap; }
  button {
    font: inherit; padding: 0.35rem 0.8rem; border-radius: 6px; border: 1px solid var(--border);
    background: var(--card); color: var(--foreground); cursor: pointer;
  }
  button.primary { background: var(--primary); color: var(--primary-foreground); border-color: var(--primary); }
  button.danger { color: var(--danger); border-color: var(--danger); }
  button:hover { opacity: 0.85; }
  input[type=number] { width: 90px; font: inherit; padding: 0.3rem; border-radius: 6px; border: 1px solid var(--border); background: var(--background); color: var(--foreground); }
  .empty { color: var(--muted); font-style: italic; padding: 0.5rem 0; }
  .verdict { font-size: 0.75rem; padding: 0.1rem 0.4rem; border-radius: 4px; }
  .verdict.acceptable, .verdict.never_fired_in_window { background: #DCFCE7; color: #166534; }
  .verdict.likely_noisy, .verdict.frequent_but_corroborated { background: #FEF3C7; color: #92400E; }
  .verdict.no_historical_data, .verdict.untestable, .verdict.query_failed { background: var(--accent); color: var(--muted); }
  .options { display: flex; gap: 0.4rem; margin-top: 0.5rem; flex-wrap: wrap; }
  #toast {
    position: fixed; bottom: 1rem; right: 1rem; background: var(--foreground); color: var(--background);
    padding: 0.6rem 1rem; border-radius: 6px; font-size: 0.85rem; opacity: 0; transition: opacity 0.2s;
  }
</style>
</head>
<body>
<header>
  <img src="/logo.svg" alt="" onerror="this.style.display='none'" />
  <div>
    <h1>Alyva-sre</h1>
    <div class="sub">Onboarding + Alert Rules + Detection &amp; RCA skills — review &amp; approve</div>
  </div>
  <a href="/" style="margin-left:auto; color:var(--primary); font-size:0.85rem; text-decoration:none;">&larr; Dashboard</a>
</header>
<main>
  <section id="investigations-section">
    <h2>Detection &amp; RCA — investigations</h2>
    <div id="investigations"></div>
  </section>
  <section id="questions-section">
    <h2>Onboarding — pending questions</h2>
    <div id="questions"></div>
  </section>
  <section id="profiles-section">
    <h2>Onboarding — service profiles</h2>
    <div id="profiles"></div>
  </section>
  <section id="review-section">
    <h2>Alert Rules — ready for review</h2>
    <div id="ready"></div>
  </section>
  <section id="needsinput-section">
    <h2>Alert Rules — needs human input</h2>
    <div id="needsinput"></div>
  </section>
  <section id="approved-section">
    <h2>Alert Rules — approved</h2>
    <div id="approved"></div>
  </section>
</main>
<div id="toast"></div>
<script>
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = 1;
  setTimeout(() => t.style.opacity = 0, 2200);
}

function tierTag(c) {
  return c ? `<span class="tag ${c}">${c}</span>` : '';
}

function evidenceBlock(rule) {
  const lines = [];
  if (rule.baseline_snapshot) {
    const b = rule.baseline_snapshot;
    lines.push(`baseline (${b.window || ''}): p99=${fmt(b.latency_p99_ms)}ms p50=${fmt(b.latency_p50_ms)}ms err=${fmt(b.error_rate_fraction)} logs=${fmt(b.log_error_lines_per_min)}/min`);
  }
  if (rule.backtest) {
    const bt = rule.backtest;
    lines.push(`backtest (${bt.hours_back}h): ${bt.samples_above_threshold ?? '?'}/${bt.total_samples ?? '?'} samples above threshold (${bt.fraction_time_above_threshold != null ? (bt.fraction_time_above_threshold*100).toFixed(1)+'%' : 'n/a'})${bt.corroborated_fraction != null ? ', ' + (bt.corroborated_fraction*100).toFixed(0)+'% corroborated by other signals' : ''}`);
    if (bt.query) lines.push(bt.query);
  }
  return lines.length ? `<div class="evidence">${lines.map(escapeHtml).join('\n')}</div>` : '';
}

function fmt(n) { return n == null ? 'n/a' : (Math.round(n*1000)/1000); }
function escapeHtml(s) { return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }

async function api(path, opts) {
  const res = await fetch(path, { headers: { 'content-type': 'application/json' }, ...opts });
  const json = await res.json();
  if (!res.ok || json.ok === false) throw new Error(json.error || 'request failed');
  return json;
}

async function load() {
  const state = await api('/api/state');
  renderInvestigations(state.investigations || []);
  renderQuestions(state.pendingOnboardingQuestions || []);
  renderProfiles(state.profiles || []);
  const rules = state.rules || [];
  renderReady(rules.filter(r => r.status === 'pending_review'));
  renderNeedsInput(rules.filter(r => r.status === 'needs_input'));
  renderApproved(rules.filter(r => r.status === 'approved'));
}

function renderInvestigations(invs) {
  const el = document.getElementById('investigations');
  if (!invs.length) { el.innerHTML = '<div class="empty">No investigations yet — nothing has breached a live threshold.</div>'; return; }
  const sorted = [...invs].sort((a, b) => (a.status === 'resolved') - (b.status === 'resolved'));
  el.innerHTML = sorted.map(inv => {
    const r = inv.report || {};
    const skeptic = inv.skeptic_review;
    return `
    <div class="card" data-inv="${inv.id}">
      <div class="row">
        <div><span class="svc">${escapeHtml(inv.service_name)}</span>
          <span style="color:var(--muted)"> / ${escapeHtml(inv.signal_type)}</span></div>
        <span class="verdict ${inv.status === 'resolved' ? 'acceptable' : (inv.converged ? 'frequent_but_corroborated' : 'likely_noisy')}">${escapeHtml(inv.status)}${inv.converged === false ? ' (not converged)' : ''}</span>
      </div>
      <div class="rationale"><b>${escapeHtml(r.headline || 'No headline yet')}</b></div>
      ${r.confidence ? `<div style="font-size:0.8rem; color:var(--muted); margin-top:0.2rem;">confidence: ${escapeHtml(r.confidence)}${r.code_fix_suggested ? ' · code fix suggested' : ''}</div>` : ''}
      ${skeptic?.contradicts_investigator ? `<div class="question">⚠ Skeptic objects: ${escapeHtml(skeptic.objection || skeptic.unstated_assumption || 'independent read disagrees')}</div>` : ''}
      <details style="margin-top:0.5rem;">
        <summary style="cursor:pointer; color:var(--muted); font-size:0.85rem;">Full evidence trail (${inv.ledger?.length || 0} tool calls)</summary>
        <div class="rationale" style="margin-top:0.5rem;"><b>Hypothesis:</b> ${escapeHtml(r.hypothesis || '')}</div>
        <div class="rationale"><b>Business impact:</b> ${escapeHtml(r.business_impact_note || 'unknown')}</div>
        <div class="rationale"><b>Next steps:</b><ul style="margin:0.3rem 0 0 1.2rem;">${(r.next_steps || []).map(s => `<li>${escapeHtml(s)}</li>`).join('')}</ul></div>
        ${skeptic ? `<div class="evidence" style="margin-top:0.5rem;">Skeptic's independent read: ${escapeHtml(skeptic.independent_hypothesis || '')}</div>` : ''}
        <div class="evidence">${(inv.ledger || []).map(e => `${e.tool}(${JSON.stringify(e.args)}) -> ${JSON.stringify(e.result).slice(0, 300)}`).join('\n')}</div>
      </details>
      ${inv.status !== 'resolved' ? `
        <div class="actions" style="margin-top:0.6rem;">
          <input type="text" class="followup-input" data-inv="${inv.id}" placeholder="Ask a follow-up — e.g. 'why didn't you check X?'" style="flex:1; min-width:280px; font:inherit; padding:0.35rem; border-radius:6px; border:1px solid var(--border); background:var(--background); color:var(--foreground);" />
          <button class="ask-followup-btn" data-inv="${inv.id}">Ask</button>
          <button class="primary resolve-btn" data-inv="${inv.id}">Resolve</button>
        </div>
      ` : inv.root_cause_tag ? `<div class="evidence" style="margin-top:0.5rem;">tagged: ${escapeHtml(inv.root_cause_tag)}</div>` : ''}
    </div>
  `;
  }).join('');

  el.querySelectorAll('.ask-followup-btn').forEach(btn => btn.addEventListener('click', async () => {
    const input = el.querySelector(`.followup-input[data-inv="${btn.dataset.inv}"]`);
    if (!input.value) return;
    try {
      await api(`/api/investigations/${btn.dataset.inv}/followup`, { method: 'POST', body: JSON.stringify({ question: input.value }) });
      toast('Follow-up answered');
      load();
    } catch (e) { toast('Error: ' + e.message); }
  }));
  el.querySelectorAll('.resolve-btn').forEach(btn => btn.addEventListener('click', async () => {
    const tag = prompt('Root-cause tag (short label, e.g. "product_catalog_feature_flag") — leave blank if not resolving to a known recurring cause:', '');
    try {
      await api(`/api/investigations/${btn.dataset.inv}/resolve`, { method: 'POST', body: JSON.stringify({ root_cause_tag: tag || null }) });
      toast('Investigation resolved');
      load();
    } catch (e) { toast('Error: ' + e.message); }
  }));
}

function renderQuestions(qs) {
  const el = document.getElementById('questions');
  if (!qs.length) { el.innerHTML = '<div class="empty">None right now.</div>'; return; }
  el.innerHTML = qs.map(q => `
    <div class="card">
      <div class="svc">${escapeHtml(q.service)} <span style="color:var(--muted); font-weight:400;">/ ${escapeHtml(q.type)}</span></div>
      <div class="rationale">${escapeHtml(q.question)}</div>
      <div class="evidence">${escapeHtml(q.evidence)}</div>
      ${q.free_text
        ? `<div class="options">
             <input type="text" class="free-text-input" data-qid="${q.id}" placeholder="Type your answer, or 'unknown'" style="flex:1; min-width:260px; font:inherit; padding:0.35rem; border-radius:6px; border:1px solid var(--border); background:var(--background); color:var(--foreground);" />
             <button class="primary submit-text-btn" data-qid="${q.id}">Submit</button>
           </div>`
        : `<div class="options">
             ${q.options.map(o => `<button data-qid="${q.id}" data-answer="${o}" class="answer-btn">${o}</button>`).join('')}
           </div>`
      }
    </div>
  `).join('');
  el.querySelectorAll('.answer-btn').forEach(btn => btn.addEventListener('click', () => submitAnswer(btn.dataset.qid, btn.dataset.answer)));
  el.querySelectorAll('.submit-text-btn').forEach(btn => btn.addEventListener('click', () => {
    const input = el.querySelector(`.free-text-input[data-qid="${btn.dataset.qid}"]`);
    submitAnswer(btn.dataset.qid, input.value || 'unknown');
  }));
}

async function submitAnswer(qid, answer) {
  try {
    await api(`/api/onboarding/questions/${qid}/answer`, { method: 'POST', body: JSON.stringify({ answer }) });
    toast(`Answered: ${answer}`);
    load();
  } catch (e) { toast('Error: ' + e.message); }
}

function renderProfiles(profiles) {
  const el = document.getElementById('profiles');
  if (!profiles.length) { el.innerHTML = '<div class="empty">No services discovered yet.</div>'; return; }
  el.innerHTML = profiles.map(p => `
    <div class="card">
      <div class="row">
        <div><span class="svc">${escapeHtml(p.service_name)}</span> ${tierTag(p.service_criticality)}
          <span style="color:var(--muted)"> (${escapeHtml(p.criticality_source || 'unresolved')})</span></div>
        <span class="verdict ${p.status === 'confirmed' ? 'acceptable' : 'no_historical_data'}">${escapeHtml(p.status)}</span>
      </div>
      <div class="rationale">
        business impact: ${p.business_impact?.status === 'provided' ? escapeHtml(p.business_impact.detail) : '<i style="color:var(--muted)">unknown, awaiting input</i>'}
      </div>
      <div class="evidence">p99=${fmt(p.snapshot?.latency_p99_ms)}ms err=${fmt(p.snapshot?.error_rate_fraction)} calls/s=${fmt(p.snapshot?.call_rate_per_sec)}</div>
      ${p.status !== 'confirmed' ? `<div class="actions"><button class="primary confirm-profile-btn" data-service="${p.service_name}">Confirm profile</button></div>` : ''}
    </div>
  `).join('');
  el.querySelectorAll('.confirm-profile-btn').forEach(btn => btn.addEventListener('click', async () => {
    try {
      await api(`/api/onboarding/profile/${btn.dataset.service}/confirm`, { method: 'POST', body: JSON.stringify({}) });
      toast('Profile confirmed');
      load();
    } catch (e) { toast('Error: ' + e.message); }
  }));
}

function ruleCard(r, actionsHtml) {
  return `
    <div class="card" data-rule="${r.id}">
      <div class="row">
        <div>
          <span class="svc">${escapeHtml(r.service_name)}</span> ${tierTag(r.criticality)}
          <span style="color:var(--muted)"> / ${escapeHtml(r.signal_type)}</span>
        </div>
        ${r.backtest && r.backtest.verdict ? `<span class="verdict ${r.backtest.verdict}">${r.backtest.verdict}</span>` : ''}
      </div>
      <div class="rationale">
        ${r.threshold != null ? `<b>${escapeHtml(r.operator || 'gt')} ${fmt(r.threshold)}${escapeHtml(r.threshold_unit||'')}</b> over ${r.window_minutes || '?'}m — ` : ''}
        ${escapeHtml(r.rationale || '')}
      </div>
      ${r.clarifying_question ? `<div class="question">${escapeHtml(r.clarifying_question)}</div>` : ''}
      ${r.open_question ? `<div class="question">${escapeHtml(r.open_question)}</div>` : ''}
      ${evidenceBlock(r)}
      ${actionsHtml || ''}
    </div>
  `;
}

function renderReady(rules) {
  const el = document.getElementById('ready');
  if (!rules.length) { el.innerHTML = '<div class="empty">Nothing drafted yet — run the pipeline.</div>'; return; }
  el.innerHTML = rules.map(r => ruleCard(r, `
    <div class="actions">
      <button class="primary approve-btn" data-id="${r.id}">Approve</button>
      <button class="edit-btn" data-id="${r.id}" data-threshold="${r.threshold}">Edit threshold</button>
      <button class="danger reject-btn" data-id="${r.id}">Reject</button>
    </div>
  `)).join('');
  wireActions(el);
}

function renderNeedsInput(rules) {
  const el = document.getElementById('needsinput');
  if (!rules.length) { el.innerHTML = '<div class="empty">None right now.</div>'; return; }
  el.innerHTML = rules.map(r => ruleCard(r, `
    <div class="actions">
      <button class="approve-btn" data-id="${r.id}">Approve as-is</button>
      <button class="edit-btn" data-id="${r.id}" data-threshold="${r.threshold || 0}">Set threshold &amp; approve</button>
      <button class="danger reject-btn" data-id="${r.id}">Reject</button>
    </div>
  `)).join('');
  wireActions(el);
}

function renderApproved(rules) {
  const el = document.getElementById('approved');
  if (!rules.length) { el.innerHTML = '<div class="empty">None approved yet.</div>'; return; }
  el.innerHTML = rules.map(r => ruleCard(r, r.retune_proposal ? `
    <div class="card" style="background:var(--accent); margin-top:0.5rem;">
      <b>Retune proposal:</b> ${fmt(r.threshold)} → ${fmt(r.retune_proposal.new_threshold)} — ${escapeHtml(r.retune_proposal.rationale || '')}
      <div class="actions">
        <button class="primary apply-retune-btn" data-id="${r.id}">Apply</button>
        <button class="danger reject-retune-btn" data-id="${r.id}">Reject</button>
      </div>
    </div>
  ` : `<div class="actions"><button class="retune-check-btn" data-id="${r.id}">Check for drift</button></div>`)).join('');
  wireActions(el);
}

function wireActions(el) {
  el.querySelectorAll('.approve-btn').forEach(b => b.addEventListener('click', () => act(`/api/rules/${b.dataset.id}/approve`, {})));
  el.querySelectorAll('.reject-btn').forEach(b => b.addEventListener('click', () => act(`/api/rules/${b.dataset.id}/reject`, {})));
  el.querySelectorAll('.edit-btn').forEach(b => b.addEventListener('click', () => {
    const v = prompt('New threshold value:', b.dataset.threshold);
    if (v === null) return;
    act(`/api/rules/${b.dataset.id}/edit`, { threshold: Number(v) });
  }));
  el.querySelectorAll('.retune-check-btn').forEach(b => b.addEventListener('click', () => act(`/api/rules/${b.dataset.id}/retune-check`, { hoursBack: 24 }, 'Checked')));
  el.querySelectorAll('.apply-retune-btn').forEach(b => b.addEventListener('click', () => act(`/api/rules/${b.dataset.id}/apply-retune`, {})));
  el.querySelectorAll('.reject-retune-btn').forEach(b => b.addEventListener('click', () => {
    const note = prompt('Why reject this retune proposal? (optional)', '');
    act(`/api/rules/${b.dataset.id}/reject-retune`, { note });
  }));
}

async function act(url, body, label) {
  try {
    await api(url, { method: 'POST', body: JSON.stringify(body) });
    toast(label || 'Done');
    load();
  } catch (e) { toast('Error: ' + e.message); }
}

load();
setInterval(load, 15000);
</script>
</body>
</html>
